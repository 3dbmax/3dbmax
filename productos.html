<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos | B-Max Impresión 3D</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            header: '#EFEAE4',
                            beige: '#EEE9E3',
                            card: '#FFFFFF',
                            tan: '#CFAD91',
                            tanhover: '#C29E80',
                            footer: '#F3EEEA',
                            dark: '#2B221B',
                            text: '#2F2620',
                            subtext: '#766B63',
                            border: '#E3DDD5'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-brand-text bg-brand-beige min-h-screen flex flex-col justify-between selection:bg-brand-tan selection:text-brand-dark">

    <!-- HEADER / NAVEGACIÓN -->
    <header class="w-full bg-brand-header sticky top-0 z-50 shadow-sm/5">
        <div class="max-w-[1360px] mx-auto px-6 lg:px-12 py-4 flex justify-between items-center">
            
            <div class="shrink-0 flex items-center gap-3">
                <button id="btn-mobile-menu" aria-label="Menú móvil" class="lg:hidden p-1 text-brand-dark hover:text-brand-tan">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>

                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="assets/logo-icon.png" alt="B-Max 3D" class="w-8 h-8 object-contain transition-transform duration-300 group-hover:scale-105" />
                    <div class="flex flex-col">
                        <span class="text-[21px] font-bold leading-none tracking-tight text-brand-dark">B-Max</span>
                        <span class="text-[8.5px] tracking-[0.28em] font-semibold text-brand-subtext mt-1 uppercase">IMPRESIÓN 3D</span>
                    </div>
                </a>
            </div>

            <nav class="hidden lg:flex items-center gap-8 text-[11px] font-semibold tracking-[0.14em] text-brand-subtext uppercase">
                <a href="index.html" class="hover:text-brand-dark transition-colors">INICIO</a>
                <a href="productos.html" class="text-brand-dark flex flex-col items-center pt-2 whitespace-nowrap">
                    PRODUCTOS
                    <span class="w-6 h-[2px] bg-brand-dark block rounded-full mt-1.5"></span>
                </a>
                <a href="personalizados.html" class="hover:text-brand-dark transition-colors">PERSONALIZADOS</a>
                <a href="nosotros.html" class="hover:text-brand-dark transition-colors">SOBRE NOSOTROS</a>
                <a href="contacto.html" class="hover:text-brand-dark transition-colors">CONTACTO</a>
            </nav>

            <div class="shrink-0 flex items-center gap-5 text-brand-dark">
                <button type="button" aria-label="Buscar" class="btn-search p-1 hover:text-brand-tan transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path stroke-linecap="round" d="M16.5 16.5L21 21"></path>
                    </svg>
                </button>
                <a href="carrito.html" aria-label="Carrito de compras" class="p-1 hover:text-brand-tan transition-colors relative flex items-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h2l1.6 8.5a2 2 0 002 1.5h8.8a2 2 0 001.9-1.4l1.7-6.6H5.5"></path>
                        <circle cx="9.5" cy="18.5" r="1.5"></circle>
                        <circle cx="16.5" cy="18.5" r="1.5"></circle>
                    </svg>
                    <span class="cart-badge hidden absolute -top-1.5 -right-2 bg-brand-dark text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- SECCIÓN PRINCIPAL DE PRODUCTOS -->
    <main class="max-w-[1360px] mx-auto px-6 lg:px-12 py-12 flex-grow w-full">
        
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-10 border-b border-brand-border/60 pb-8">
            <div>
                <span class="text-[10.5px] font-bold tracking-[0.22em] text-brand-subtext uppercase">Catálogo Completo</span>
                <h1 class="text-3xl lg:text-4xl font-light text-brand-dark mt-1">Nuestros Productos</h1>
            </div>

            <!-- Filtros por Categoría -->
            <div id="category-filters" class="flex flex-wrap gap-2">
                <!-- Se llenan dinámicamente -->
            </div>
        </div>

        <!-- Grilla de Productos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-12 text-brand-subtext font-light text-xs">
                Cargando productos de la nube...
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-brand-footer py-10 border-t border-brand-border/60">
        <div class="max-w-[1360px] mx-auto px-6 lg:px-12 flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="shrink-0">
                <a href="index.html" class="flex items-center gap-3">
                    <img src="assets/logo-icon.png" alt="B-Max 3D" class="w-8 h-8 object-contain" />
                    <div class="flex flex-col">
                        <span class="text-[20px] font-bold leading-none text-brand-dark">B-Max</span>
                        <span class="text-[8.5px] tracking-[0.28em] font-semibold text-brand-subtext mt-1 uppercase">IMPRESIÓN 3D</span>
                    </div>
                </a>
            </div>
            <p class="text-xs text-brand-subtext">&copy; B-Max Impresión 3D. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- SCRIPTS MÓDULOS -->
    <script type="module">
        import { syncFirebaseData, BMAX_CATEGORIES, BMAX_PRODUCTS, formatPrice } from './assets/products.js';
        import { addToCart } from './assets/app.js';

        let selectedCategory = 'todos';

        document.addEventListener('DOMContentLoaded', async () => {
            // Sincronizar y hacer la siembra automática en Firebase si la base está vacía
            await syncFirebaseData();

            // Leer parámetro de URL si viene desde otra página (ej: ?cat=decoracion o ?q=maceta)
            const urlParams = new URLSearchParams(window.location.search);
            const catParam = urlParams.get('cat');
            if (catParam) selectedCategory = catParam;

            renderCategories();
            renderProducts(urlParams.get('q'));
        });

        function renderCategories() {
            const container = document.getElementById('category-filters');
            if (!container) return;

            container.innerHTML = BMAX_CATEGORIES.map(c => {
                const isActive = c.id === selectedCategory;
                return `
                    <button data-catid="${c.id}" class="btn-filter-cat px-4 py-2 rounded-full text-xs font-semibold uppercase tracking-wider transition-all border ${
                        isActive 
                            ? 'bg-brand-dark text-white border-brand-dark' 
                            : 'bg-white text-brand-dark border-brand-border hover:bg-brand-tan/20'
                    }">
                        ${c.name}
                    </button>
                `;
            }).join('');

            document.querySelectorAll('.btn-filter-cat').forEach(btn => {
                btn.onclick = () => {
                    selectedCategory = btn.getAttribute('data-catid');
                    renderCategories();
                    renderProducts();
                };
            });
        }

        function renderProducts(searchQuery = null) {
            const container = document.getElementById('products-grid');
            if (!container) return;

            let list = [...BMAX_PRODUCTS];

            // Filtrar por categoría
            if (selectedCategory && selectedCategory !== 'todos') {
                list = list.filter(p => p.category === selectedCategory);
            }

            // Filtrar por texto de búsqueda si viene un parámetro 'q'
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                list = list.filter(p => p.name.toLowerCase().includes(q) || (p.shortDesc && p.shortDesc.toLowerCase().includes(q)));
            }

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-brand-subtext font-light text-sm bg-white rounded-2xl border border-brand-border">
                        No se encontraron productos disponibles en esta sección.
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(p => `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-brand-border/60 flex flex-col justify-between hover:shadow-md transition-all duration-300">
                    <div>
                        <div class="w-full aspect-square overflow-hidden rounded-xl bg-brand-beige mb-4 border border-brand-border/40">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105" />
                        </div>
                        <span class="text-[9px] font-bold uppercase tracking-wider text-brand-subtext">${p.categoryName || p.category}</span>
                        <h3 class="text-xs font-bold text-brand-dark mt-0.5 line-clamp-1">${p.name}</h3>
                        <p class="text-[11px] text-brand-subtext mt-1.5 leading-relaxed line-clamp-2">${p.shortDesc || p.desc || ''}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-brand-border/50 flex justify-between items-center gap-2">
                        <span class="text-xs font-bold text-brand-dark">${formatPrice(p.price)}</span>
                        <button data-prodid="${p.id}" class="btn-add-cart bg-brand-tan hover:bg-brand-tanhover text-brand-dark px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider transition-colors shadow-sm">
                            + Carrito
                        </button>
                    </div>
                </div>
            `).join('');

            // Event listener para agregar al carrito
            document.querySelectorAll('.btn-add-cart').forEach(btn => {
                btn.onclick = () => {
                    const id = btn.getAttribute('data-prodid');
                    const product = BMAX_PRODUCTS.find(p => p.id === id);
                    if (product) addToCart(product);
                };
            });
        }
    </script>
</body>
</html>
