<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | B-Max 3D</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            header: '#EFEAE4',
                            beige: '#EEE9E3',
                            card: '#FFFFFF',
                            tan: '#CFAD91',
                            tanhover: '#C29E80',
                            footer: '#F3EEEA',
                            dark: '#2B221B',
                            text: '#2F2620',
                            subtext: '#766B63',
                            border: '#E3DDD5'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script src="assets/app.js"></script>
</head>
<body class="font-sans text-brand-text bg-brand-beige min-h-screen flex flex-col justify-between">

    <!-- HEADER ADMIN -->
    <header class="bg-brand-dark text-white py-4 px-6 lg:px-12 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <a href="index.html" class="flex items-center gap-2">
                <img src="assets/logo-icon.png" alt="B-Max" class="w-7 h-7 object-contain" />
                <span class="text-lg font-bold">B-Max Admin (Cloud Firebase)</span>
            </a>
            <span class="bg-brand-tan/30 text-brand-tan text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase">Panel Cami</span>
        </div>
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-xs text-gray-300 hover:text-white transition-colors">Ver Sitio Web</a>
            <button id="btn-logout" class="bg-red-500/20 hover:bg-red-500 text-red-200 hover:text-white px-3 py-1.5 rounded-full text-xs font-semibold transition-all">
                Cerrar Sesión
            </button>
        </div>
    </header>

    <!-- CONTENIDO ADMIN -->
    <main class="max-w-[1360px] mx-auto px-6 lg:px-12 py-10 w-full flex-grow">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl lg:text-3xl font-light text-brand-dark">Control de Catálogos y Nube</h1>
                <p class="text-xs text-brand-subtext mt-1">Los cambios guardados aquí se actualizarán automáticamente para todos los visitantes.</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="btn-open-cat-modal" class="bg-white hover:bg-brand-tan/20 text-brand-dark border border-brand-border font-bold px-4 py-2.5 rounded-full text-xs uppercase tracking-wider transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>Nuevo / Editar Catálogo</span>
                </button>
                <button id="btn-open-prod-modal" class="bg-brand-tan hover:bg-brand-tanhover text-brand-dark font-bold px-5 py-2.5 rounded-full text-xs uppercase tracking-wider shadow-sm transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                    <span>Nuevo Producto</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-8 space-y-6">
                <!-- CATÁLOGOS -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-brand-border">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-brand-dark mb-4 pb-2 border-b border-brand-border">
                        Catálogos Activos y Portadas
                    </h2>
                    <div id="admin-categories-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
                </div>

                <!-- PRODUCTOS -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-brand-border">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-brand-dark mb-4 pb-2 border-b border-brand-border">
                        Productos en la Base de Datos
                    </h2>
                    <div id="admin-products-list" class="divide-y divide-brand-border/60"></div>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-4">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-brand-border sticky top-6">
                    <div class="flex justify-between items-center pb-3 border-b border-brand-border mb-4">
                        <h2 class="text-sm font-bold uppercase tracking-wider text-brand-dark">Carrito Local</h2>
                        <button id="btn-clear-cart" class="text-xs text-red-500 hover:underline">Vaciar</button>
                    </div>
                    <div id="admin-cart-list" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL CATÁLOGO MEJORADO -->
    <div id="category-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-[#FAF7F4] w-full max-w-md rounded-3xl p-6 shadow-2xl border border-brand-border relative">
            <button id="btn-close-cat" class="absolute top-4 right-4 text-gray-400 hover:text-black text-xl">&times;</button>
            <h2 id="cat-modal-title" class="text-xl font-light text-brand-dark mb-4">Gestión de Catálogo</h2>
            
            <form id="category-form" class="space-y-4">
                <input type="hidden" id="cat-id" />
                <div>
                    <label class="block text-xs font-semibold text-brand-dark mb-1">Nombre del Catálogo *</label>
                    <input type="text" id="cat-name" required placeholder="Ej: Decoración" class="w-full bg-white border border-brand-border rounded-xl px-3.5 py-2 text-xs" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-brand-dark mb-1">Subtítulo / Comentario *</label>
                    <input type="text" id="cat-subtitle" required placeholder="Ej: Detalles que hacen la diferencia" class="w-full bg-white border border-brand-border rounded-xl px-3.5 py-2 text-xs" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-brand-dark mb-1">Imagen de Portada (Firebase Storage)</label>
                    <div class="flex items-center gap-3">
                        <input type="file" id="cat-image-file" accept="image/*" class="text-xs text-brand-subtext file:mr-2 file:py-1 file:px-2.5 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-brand-tan file:text-brand-dark cursor-pointer" />
                        <img id="cat-image-preview" src="" class="w-10 h-10 object-cover rounded-lg bg-gray-200 hidden border border-brand-border" />
                    </div>
                    <input type="hidden" id="cat-image-url" />
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="btn-cancel-cat" class="px-4 py-2 rounded-full text-xs font-semibold text-brand-subtext">Cancelar</button>
                    <button type="submit" id="btn-submit-cat" class="bg-brand-tan hover:bg-brand-tanhover text-brand-dark font-bold px-5 py-2 rounded-full text-xs uppercase tracking-wider">Guardar Catálogo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL PRODUCTO -->
    <div id="edit-product-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-[#FAF7F4] w-full max-w-2xl rounded-3xl p-6 md:p-8 shadow-2xl border border-brand-border relative max-h-[90vh] overflow-y-auto">
            <button id="btn-close-prod" class="absolute top-4 right-4 text-gray-400 hover:text-black text-xl">&times;</button>
            <h2 id="modal-title" class="text-xl font-light text-brand-dark mb-6">Editar Producto</h2>

            <form id="product-form" class="space-y-4">
                <input type="hidden" id="form-id" />
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-brand-dark mb-1">Nombre *</label>
                        <input type="text" id="form-name" required class="w-full bg-white border border-brand-border rounded-xl px-3.5 py-2 text-xs" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-brand-dark mb-1">Precio ARS ($) *</label>
                        <input type="number" id="form-price" required class="w-full bg-white border border-brand-border rounded-xl px-3.5 py-2 text-xs" />
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-brand-dark mb-1">Catálogo / Categoría</label>
                        <select id="form-category" class="w-full bg-white border border-brand-border rounded-xl px-3.5 py-2 text-xs"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-brand-dark mb-1">Materiales</label>
                        <input type="text" id="form-material" placeholder="Ej: PLA Premium ecológico" class="w-full bg-white border border-brand-border rounded-xl px-3.5 py-2 text-xs" />
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-brand-dark mb-1">Imagen del Producto</label>
                    <div class="flex items-center gap-4">
                        <input type="file" id="form-image-file" accept="image/*" class="text-xs text-brand-subtext file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-brand-tan file:text-brand-dark cursor-pointer" />
                        <img id="image-preview" src="" class="w-12 h-12 object-cover rounded-xl bg-gray-200 hidden border border-brand-border" />
                    </div>
                    <input type="hidden" id="form-image-url" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-brand-dark mb-1">Descripción Completa</label>
                    <div id="editor-content" contenteditable="true" class="w-full min-h-[120px] bg-white border border-brand-border rounded-xl p-3 text-xs focus:outline-none focus:border-brand-tan leading-relaxed"></div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-brand-border">
                    <button type="button" id="btn-cancel-prod" class="px-5 py-2.5 rounded-full text-xs font-semibold text-brand-subtext hover:bg-gray-200">Cancelar</button>
                    <button type="submit" id="btn-submit-prod" class="bg-brand-tan hover:bg-brand-tanhover text-brand-dark font-bold px-6 py-2.5 rounded-full text-xs uppercase tracking-wider">Subir a Nube</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MÓDULO JS PRINCIPAL -->
    <script type="module">
        import { 
            syncFirebaseData, BMAX_CATEGORIES, BMAX_PRODUCTS, formatPrice, 
            uploadImageToStorage, saveProductToFirebase, deleteProductFromFirebase,
            saveCategoryToFirebase, deleteCategoryFromFirebase
        } from './assets/products.js';

        let selectedProductFile = null;
        let selectedCatFile = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.isAdminLoggedIn()) {
                alert('Acceso no autorizado.');
                window.location.href = 'index.html';
                return;
            }

            await syncFirebaseData();
            renderAll();
            setupEventListeners();
        });

        function renderAll() {
            renderCategories();
            renderProducts();
            renderCart();
        }

        function renderCategories() {
            const container = document.getElementById('admin-categories-list');
            container.innerHTML = BMAX_CATEGORIES.map(c => {
                if (c.id === 'todos') return '';
                return `
                    <div class="bg-brand-beige/60 border border-brand-border rounded-xl p-3 flex items-center justify-between gap-3 text-xs">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <img src="${c.image || 'assets/imagenes/producto (1).jpg'}" class="w-12 h-12 object-cover rounded-lg bg-gray-200 shrink-0" />
                            <div class="truncate">
                                <div class="font-bold text-brand-dark">${c.name}</div>
                                <div class="text-[10px] text-brand-subtext truncate">${c.subtitle || ''}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button data-catid="${c.id}" class="btn-edit-cat px-2.5 py-1 bg-white hover:bg-brand-tan/30 rounded-full font-semibold text-[11px]">Editar</button>
                            <button data-catid="${c.id}" class="btn-delete-cat px-2.5 py-1 bg-red-100 hover:bg-red-200 text-red-700 rounded-full font-semibold text-[11px]">&times;</button>
                        </div>
                    </div>
                `;
            }).join('');

            const select = document.getElementById('form-category');
            select.innerHTML = BMAX_CATEGORIES.filter(c => c.id !== 'todos').map(c => `
                <option value="${c.id}">${c.name}</option>
            `).join('');

            document.querySelectorAll('.btn-edit-cat').forEach(btn => {
                btn.onclick = () => openEditCategoryModal(btn.getAttribute('data-catid'));
            });

            document.querySelectorAll('.btn-delete-cat').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute('data-catid');
                    if (confirm('¿Eliminar este catálogo de Firebase?')) {
                        await deleteCategoryFromFirebase(id);
                        renderAll();
                        window.showToast('Catálogo eliminado');
                    }
                };
            });
        }

        function renderProducts() {
            const list = document.getElementById('admin-products-list');
            list.innerHTML = BMAX_PRODUCTS.map(p => `
                <div class="py-4 flex items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <img src="${p.image}" class="w-14 h-14 object-cover rounded-xl bg-brand-beige shrink-0" />
                        <div>
                            <span class="text-[9px] font-bold uppercase tracking-wider text-brand-subtext">${p.categoryName || p.category}</span>
                            <h4 class="text-xs font-bold text-brand-dark">${p.name}</h4>
                            <span class="text-xs font-semibold text-brand-dark">${formatPrice(p.price)}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button data-prodid="${p.id}" class="btn-edit-prod px-3 py-1.5 bg-brand-beige hover:bg-brand-tan/30 text-brand-dark rounded-full text-xs font-semibold">Editar</button>
                        <button data-prodid="${p.id}" class="btn-del-prod px-3 py-1.5 bg-red-100 hover:bg-red-200 text-red-700 rounded-full text-xs font-semibold">Eliminar</button>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.btn-edit-prod').forEach(btn => {
                btn.onclick = () => openEditProductModal(btn.getAttribute('data-prodid'));
            });

            document.querySelectorAll('.btn-del-prod').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute('data-prodid');
                    if (confirm('¿Eliminar producto de Firebase?')) {
                        await deleteProductFromFirebase(id);
                        renderAll();
                        window.showToast('Producto eliminado.');
                    }
                };
            });
        }

        function renderCart() {
            const container = document.getElementById('admin-cart-list');
            const cart = window.getCart ? window.getCart() : [];

            if (!cart || cart.length === 0) {
                container.innerHTML = `<p class="text-xs text-brand-subtext italic">El carrito está vacío.</p>`;
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="p-3 bg-brand-beige/40 rounded-xl flex items-center justify-between text-xs">
                    <div>
                        <div class="font-bold text-brand-dark">${item.name}</div>
                        <div class="text-brand-subtext">${item.quantity}u x ${formatPrice(item.price)}</div>
                    </div>
                    <button data-cartid="${item.id}" class="btn-del-cart text-red-500 font-bold hover:text-red-700">&times;</button>
                </div>
            `).join('');

            document.querySelectorAll('.btn-del-cart').forEach(btn => {
                btn.onclick = () => {
                    if (window.removeFromCart) window.removeFromCart(btn.getAttribute('data-cartid'));
                    renderCart();
                };
            });
        }

        function setupEventListeners() {
            document.getElementById('btn-logout').onclick = () => window.logoutAdmin();
            document.getElementById('btn-clear-cart').onclick = () => { 
                if (window.clearCart) window.clearCart(); 
                renderCart(); 
            };

            // MODAL CATÁLOGO
            document.getElementById('btn-open-cat-modal').onclick = () => openEditCategoryModal(null);
            const closeCat = () => {
                document.getElementById('category-modal').classList.add('hidden');
                document.getElementById('category-modal').classList.remove('flex');
            };
            document.getElementById('btn-close-cat').onclick = closeCat;
            document.getElementById('btn-cancel-cat').onclick = closeCat;

            document.getElementById('cat-image-file').onchange = (e) => {
                selectedCatFile = e.target.files[0];
                if (selectedCatFile) {
                    const preview = document.getElementById('cat-image-preview');
                    preview.src = URL.createObjectURL(selectedCatFile);
                    preview.classList.remove('hidden');
                }
            };

            document.getElementById('category-form').onsubmit = async (e) => {
                e.preventDefault();
                const btnSubmit = document.getElementById('btn-submit-cat');
                btnSubmit.disabled = true;
                btnSubmit.textContent = 'Guardando...';

                try {
                    const name = document.getElementById('cat-name').value.trim();
                    const subtitle = document.getElementById('cat-subtitle').value.trim();
                    const existingId = document.getElementById('cat-id').value;
                    const id = existingId || name.toLowerCase().replace(/[^a-z0-9]/g, '');

                    let imageUrl = document.getElementById('cat-image-url').value;
                    if (selectedCatFile) {
                        imageUrl = await uploadImageToStorage(selectedCatFile, 'categorias');
                    }

                    await saveCategoryToFirebase({ 
                        id: id, 
                        name: name, 
                        subtitle: subtitle, 
                        image: imageUrl || 'assets/imagenes/producto (1).jpg' 
                    });

                    closeCat();
                    renderAll();
                    window.showToast('Catálogo guardado en Firebase');
                } catch (err) {
                    alert('Error al guardar catálogo: ' + err.message);
                } finally {
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Guardar Catálogo';
                }
            };

            // MODAL PRODUCTO
            document.getElementById('btn-open-prod-modal').onclick = () => openEditProductModal(null);
            const closeProd = () => {
                document.getElementById('edit-product-modal').classList.add('hidden');
                document.getElementById('edit-product-modal').classList.remove('flex');
            };
            document.getElementById('btn-close-prod').onclick = closeProd;
            document.getElementById('btn-cancel-prod').onclick = closeProd;

            document.getElementById('form-image-file').onchange = (e) => {
                selectedProductFile = e.target.files[0];
                if (selectedProductFile) {
                    const preview = document.getElementById('image-preview');
                    preview.src = URL.createObjectURL(selectedProductFile);
                    preview.classList.remove('hidden');
                }
            };

            document.getElementById('product-form').onsubmit = async (e) => {
                e.preventDefault();
                const btnSubmit = document.getElementById('btn-submit-prod');
                btnSubmit.disabled = true;
                btnSubmit.textContent = 'Subiendo a Nube...';

                try {
                    let imageUrl = document.getElementById('form-image-url').value;
                    if (selectedProductFile) {
                        imageUrl = await uploadImageToStorage(selectedProductFile, 'productos');
                    }

                    const id = document.getElementById('form-id').value || 'prod-' + Date.now();
                    const categorySelect = document.getElementById('form-category');

                    const newProd = {
                        id: id,
                        name: document.getElementById('form-name').value.trim(),
                        price: Number(document.getElementById('form-price').value),
                        category: categorySelect.value,
                        categoryName: categorySelect.options[categorySelect.selectedIndex].text,
                        material: document.getElementById('form-material').value.trim() || 'PLA Premium',
                        image: imageUrl || 'assets/imagenes/producto (1).jpg',
                        shortDesc: document.getElementById('editor-content').innerText.slice(0, 80) + '...',
                        desc: document.getElementById('editor-content').innerHTML,
                        dimensions: 'Estándar',
                        colors: ['A elección']
                    };

                    await saveProductToFirebase(newProd);
                    closeProd();
                    renderAll();
                    window.showToast('¡Producto guardado en la nube!');
                } catch (err) {
                    alert('Error al guardar en Firebase: ' + err.message);
                } finally {
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Subir a Nube';
                }
            };
        }

        function openEditCategoryModal(id) {
            selectedCatFile = null;
            const c = id ? BMAX_CATEGORIES.find(item => item.id === id) : null;

            document.getElementById('cat-id').value = c ? c.id : '';
            document.getElementById('cat-name').value = c ? c.name : '';
            document.getElementById('cat-subtitle').value = c ? (c.subtitle || '') : '';
            document.getElementById('cat-image-url').value = c ? (c.image || '') : '';

            const preview = document.getElementById('cat-image-preview');
            preview.src = c ? (c.image || 'assets/imagenes/producto (1).jpg') : '';
            if (c && c.image) preview.classList.remove('hidden');
            else preview.classList.add('hidden');

            document.getElementById('cat-modal-title').textContent = c ? 'Editar Catálogo' : 'Crear Nuevo Catálogo';

            const modal = document.getElementById('category-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function openEditProductModal(id) {
            selectedProductFile = null;
            const p = id ? BMAX_PRODUCTS.find(item => item.id === id) : null;

            document.getElementById('form-id').value = p ? p.id : '';
            document.getElementById('form-name').value = p ? p.name : '';
            document.getElementById('form-price').value = p ? p.price : '';
            document.getElementById('form-category').value = p ? p.category : (BMAX_CATEGORIES[1]?.id || 'organizacion');
            document.getElementById('form-material').value = p ? (p.material || '') : '';
            document.getElementById('form-image-url').value = p ? p.image : 'assets/imagenes/producto (1).jpg';
            
            const preview = document.getElementById('image-preview');
            preview.src = p ? p.image : 'assets/imagenes/producto (1).jpg';
            preview.classList.remove('hidden');

            document.getElementById('editor-content').innerHTML = p ? (p.desc || p.shortDesc || '') : '';
            document.getElementById('modal-title').textContent = p ? 'Editar Producto' : 'Nuevo Producto';

            const modal = document.getElementById('edit-product-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
    </script>
</body>
</html>
